name: veggiepal-prm

services:
  mysql:
    container_name: veggiepal-prm-mysql
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PRM_MYSQL_HOST_PORT:-4307}:3306"
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ngrok:
    container_name: veggiepal-prm-ngrok
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - http
      - host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN must be set in .env}
    ports:
      - "127.0.0.1:${PRM_NGROK_INSPECTOR_HOST_PORT:-5041}:4040"
    networks:
      - backend
    depends_on:
      mysql:
        condition: service_healthy

networks:
  backend:
    name: veggiepal-prm-backend
    driver: bridge

volumes:
  mysql_data:
    name: veggiepal-prm-mysql-data
