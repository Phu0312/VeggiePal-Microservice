spring.application.name=identity-service
server.port=${SERVER_PORT:18081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${DB_PORT:3307}/veggiepal_identity?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

jwt.secret=${JWT_SECRET:veggiepal-secret-key-must-be-at-least-32-characters}

storage.s3.endpoint=${S3_ENDPOINT:http://localhost:19000}
storage.s3.region=${S3_REGION:us-east-1}
storage.s3.access-key=${S3_ACCESS_KEY:minioadmin}
storage.s3.secret-key=${S3_SECRET_KEY:minioadmin}
storage.s3.bucket=${S3_BUCKET:veggiepal-avatars}
storage.s3.public-url=${S3_PUBLIC_URL:http://localhost:19000/veggiepal-avatars}

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Seed data
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8