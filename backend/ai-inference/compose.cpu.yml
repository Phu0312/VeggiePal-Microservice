services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-b10884
    gpus: !reset null
    command:
      - --model
      - /models/${LLAMA_MODEL_FILE:-qwen2.5-1.5b-instruct-q4_k_m.gguf}
      - --alias
      - ${AI_LOCAL_MODEL:-qwen2.5-1.5b-instruct}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - ${LLAMA_CTX_SIZE:-2048}
      - --parallel
      - ${LLAMA_PARALLEL:-1}
      - --batch-size
      - ${LLAMA_BATCH_SIZE:-256}
      - --n-gpu-layers
      - "0"
