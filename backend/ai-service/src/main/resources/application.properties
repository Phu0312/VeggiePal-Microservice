spring.application.name=ai-service
server.port=${AI_SERVICE_PORT:8086}
server.forward-headers-strategy=framework
ai.trusted-proxies=${AI_TRUSTED_PROXIES:127.0.0.1,::1}
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# The four AI features use the local llama.cpp server.
ai.local.base-url=${AI_LOCAL_BASE_URL:http://llama:8080/v1}
ai.local.model=${AI_LOCAL_MODEL:qwen2.5-1.5b-instruct}
ai.local.connect-timeout=${AI_LOCAL_CONNECT_TIMEOUT:10s}
ai.local.read-timeout=${AI_LOCAL_READ_TIMEOUT:120s}

# MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/veggiepal_ai?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# JWT must match identity-service.
jwt.secret=${JWT_SECRET:veggiepal-secret-key-must-be-at-least-32-characters}

# Existing downstream APIs. AI never fabricates domain data.
services.blog.base-url=${BLOG_SERVICE_URL:http://localhost:8083}
services.recipe.base-url=${RECIPE_SERVICE_URL:http://localhost:8084}
services.nutrition.base-url=${NUTRITION_SERVICE_URL:http://localhost:8082}
services.identity.base-url=${IDENTITY_SERVICE_URL:http://localhost:8081}
services.payment.base-url=${PAYMENT_SERVICE_URL:http://localhost:8087}
services.internal-token=${INTERNAL_SERVICE_TOKEN:}

ai.chat.guest-daily-limit=${AI_GUEST_DAILY_LIMIT:3}
ai.chat.member-daily-limit=${AI_MEMBER_DAILY_LIMIT:50}
ai.guest.session-pepper=${AI_GUEST_SESSION_PEPPER:${jwt.secret:${JWT_SECRET:veggiepal-secret-key-must-be-at-least-32-characters}}}
ai.guest.session-ttl=${AI_GUEST_SESSION_TTL:24h}
ai.guest.max-sessions-per-ip-per-day=${AI_GUEST_MAX_SESSIONS_PER_IP_PER_DAY:3}
ai.chat.max-history-messages=${AI_CHAT_MAX_HISTORY:12}
ai.chat.max-input-characters=${AI_CHAT_MAX_INPUT_CHARS:4000}
ai.token.daily-limit=${AI_DAILY_TOKEN_LIMIT:50000}
ai.deployment-mode=${AI_DEPLOYMENT_MODE:production}
ai.local-test-quota.enabled=${AI_LOCAL_TEST_QUOTA_ENABLED:false}
ai.local-test-quota.daily-requests-per-feature=${AI_LOCAL_TEST_QUOTA_DAILY_LIMIT:100}
ai.local-test-quota.daily-token-limit=${AI_LOCAL_TEST_TOKEN_DAILY_LIMIT:5000000}
ai.meal-plan.min-portion-scale=${AI_MEAL_PLAN_MIN_PORTION_SCALE:0.75}
ai.meal-plan.max-portion-scale=${AI_MEAL_PLAN_MAX_PORTION_SCALE:1.50}

# Actuator
management.endpoints.web.exposure.include=health,info
