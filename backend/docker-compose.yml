services:
  veggiepal-mysql:
    image: mysql:8.4
    container_name: veggiepal-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345}
      MYSQL_DATABASE: veggiepal

    ports:
      - "${MYSQL_HOST_PORT:-53306}:3306"

    volumes:
      - veggiepal_mysql_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 12

  veggiepal-minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: veggiepal-minio
    restart: always
    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"

    volumes:
      - veggiepal_minio_data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: create buckets and allow anonymous downloads
  veggiepal-minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: veggiepal-minio-init
    depends_on:
      veggiepal-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://veggiepal-minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/veggiepal-avatars &&
      mc anonymous set download local/veggiepal-avatars &&
      mc mb --ignore-existing local/veggiepal-blog-thumbnails &&
      mc anonymous set download local/veggiepal-blog-thumbnails &&
      mc mb --ignore-existing local/veggiepal-videos &&
      mc anonymous set download local/veggiepal-videos
      "

volumes:
  veggiepal_mysql_data:
  veggiepal_minio_data:
