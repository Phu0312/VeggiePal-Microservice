name: veggiepal_microservice

services:
  mysql:
    image: mysql:8.4
    container_name: veggiepal-ms-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: veggiepal

    ports:
      - "54306:3306"

    volumes:
      - veggiepal_mysql_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d

  minio:
    image: coollabsio/minio:latest
    container_name: veggiepal-ms-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "19100:9000"
      - "19101:9001"

    volumes:
      - veggiepal_minio_data:/data

volumes:
  veggiepal_mysql_data:
  veggiepal_minio_data: