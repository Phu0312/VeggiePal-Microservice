<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="100%" height="100%">
  <defs>
    <!-- Primary Green Gradient (Icon Bowl & Leaves) -->
    <linearGradient id="veggiePrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="60%" stop-color="#388E3C" />
      <stop offset="100%" stop-color="#8BC34A" />
    </linearGradient>

    <!-- Accent Warm Gradient (Highlight Leaf) -->
    <linearGradient id="veggieAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8BC34A" />
      <stop offset="100%" stop-color="#FBC02D" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B5E20" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
  </defs>

  <!-- Background Card (Soft Eco White) -->
  <rect width="700" height="280" rx="40" fill="#F7F9F6" />

  <!-- LOGO ICON GROUP (Bát ăn bên trái) -->
  <g transform="translate(40, -10)">
    <!-- Main Meal Bowl -->
    <path d="M 30,140 C 30,220 90,260 150,260 C 210,260 270,220 270,140 Z" 
          fill="url(#veggiePrimaryGrad)" />

    <!-- Bowl Shadow -->
    <ellipse cx="150" cy="270" rx="60" ry="8" fill="#8BC34A" opacity="0.3" />

    <!-- Left Sprout Leaf -->
    <path d="M 150,130 C 100,100 80,40 120,20 C 160,50 160,90 150,130 Z" 
          fill="url(#veggiePrimaryGrad)" />

    <!-- Right Sprout Leaf -->
    <path d="M 150,135 C 190,105 220,50 180,30 C 150,60 145,100 150,135 Z" 
          fill="url(#veggieAccentGrad)" />

    <!-- Eco Dot Detail -->
    <circle cx="150" cy="170" r="10" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- LOGO WORDMARK & TAGLINE (Kế bên góc phải) -->
  <g transform="translate(320, 145)">
    <!-- Main Brand Name -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="68" 
          font-weight="800" 
          letter-spacing="0.5">
      <tspan fill="url(#textGrad)">Veggie</tspan><tspan fill="#8BC34A">Pal</tspan>
    </text>

    <!-- Tagline dưới tên -->
    <text x="5" y="38" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="18" 
          font-weight="600" 
          fill="#558B2F" 
          letter-spacing="2.5">
      HEALTHY &amp; VEGAN NUTRITION
    </text>
  </g>
</svg>
